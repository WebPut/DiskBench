name: Test, Minify, and Deploy

on:
  push:
    branches:
      - dev

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------------
      # 1. CHECKOUT
      # -------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # 2. SETUP NODE
      # -------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # -------------------------------------------------------------
      # 3. AUTO-CREATE package.json IF MISSING
      # -------------------------------------------------------------
      - name: Create package.json if missing
        run: |
          if [ ! -f package.json ]; then
            cat > package.json <<'EOF'
          {
            "name": "github-pages-site",
            "private": true,
            "type": "module",
            "devDependencies": {
              "@playwright/test": "^1.54.1",
              "clean-css-cli": "^5.6.3",
              "eslint": "^9.32.0",
              "html-minifier-terser": "^7.2.0",
              "html-validate": "^10.1.2",
              "http-server": "^14.1.1",
              "stylelint": "^16.24.0",
              "stylelint-config-standard": "^39.0.0",
              "terser": "^5.43.1"
            }
          }
          EOF
          fi

      # -------------------------------------------------------------
      # 4. INSTALL DEPENDENCIES
      # -------------------------------------------------------------
      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # -------------------------------------------------------------
      # 5. CREATE MINIMAL CONFIGS IF MISSING
      # -------------------------------------------------------------
      - name: Create default linter configs if missing
        run: |
          if [ ! -f .htmlvalidate.json ]; then
            echo '{"extends":["html-validate:recommended"]}' > .htmlvalidate.json
          fi

          if [ ! -f stylelint.config.js ]; then
            cat > stylelint.config.js <<'EOF'
          export default {
            extends: ["stylelint-config-standard"]
          };
          EOF
          fi

          if [ ! -f eslint.config.js ]; then
            cat > eslint.config.js <<'EOF'
          export default [
            {
              files: ["js/**/*.js"],
              languageOptions: {
                ecmaVersion: "latest",
                sourceType: "module"
              },
              rules: {}
            }
          ];
          EOF
          fi

      # -------------------------------------------------------------
      # 6. INSTALL PLAYWRIGHT BROWSERS
      # -------------------------------------------------------------
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # -------------------------------------------------------------
      # STEP A: LINT EVERYTHING
      # -------------------------------------------------------------
      # -------------------------------------------------------------
# STEP A: LINT EVERYTHING
# -------------------------------------------------------------

        - {
    "name": "Run HTML Linter",
    "run": "find . -name '*.html' -not -path './node_modules/*' -not -path './dist/*' -print0 | xargs -0 npx html-validate"
  }

- {
    "name": "Run Stylelint (CSS)",
    "run": "if [ -d css ]; then npx stylelint 'css/**/*.css'; fi"
  }

- {
    "name": "Run ESLint (JS)",
    "run": "if [ -d js ]; then npx eslint 'js/**/*.js'; fi"
  }
      # -------------------------------------------------------------
      # STEP B: PLAYWRIGHT TESTS (RAW SOURCE)
      # -------------------------------------------------------------
      - name: Start Local Server (Source)
        run: |
          npx http-server . -p 4172 &
          sleep 5

      - name: Run Playwright Tests (Raw Source Code)
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4172
        run: |
          if [ -d tests ]; then
            npx playwright test
          else
            echo "No tests directory found - skipping raw Playwright tests."
          fi

      # -------------------------------------------------------------
      # STEP C: BUILD & MINIFY
      # -------------------------------------------------------------
      - name: Build & Minify Files
        run: |
          rm -rf dist
          mkdir -p dist/css dist/js

          # --------------------
          # Minify HTML
          # --------------------
          find . -name "*.html" \
            -not -path "./node_modules/*" \
            -not -path "./dist/*" \
            -print0 | while IFS= read -r -d '' file; do
              mkdir -p "dist/$(dirname "$file")"

              npx html-minifier-terser "$file" \
                --collapse-whitespace \
                --remove-comments \
                --minify-css true \
                --minify-js true \
                -o "dist/$file"
          done

          # --------------------
          # Minify CSS
          # --------------------
          if compgen -G "css/*.css" > /dev/null; then
            npx cleancss \
              --batch \
              --batch-suffix "" \
              -o dist/css \
              "css/*.css"
          fi

          # --------------------
          # Minify JS
          # --------------------
          if compgen -G "js/*.js" > /dev/null; then
            for file in js/*.js; do
              npx terser "$file" \
                --compress \
                --mangle \
                -o "dist/$file"
            done
          fi

          # --------------------
          # Copy static assets if they exist
          # --------------------
          for dir in images img assets fonts media; do
            if [ -d "$dir" ]; then
              mkdir -p "dist/$dir"
              cp -R "$dir/"* "dist/$dir/" 2>/dev/null || true
            fi
          done

      # -------------------------------------------------------------
      # STEP D: TEST MINIFIED BUILD
      # -------------------------------------------------------------
      - name: Start Local Server (Dist)
        run: |
          npx http-server dist -p 4173 &
          sleep 5

      - name: Run Playwright Tests Against Minified Code
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4173
        run: |
          if [ -d tests ]; then
            npx playwright test
          else
            echo "No tests directory found - skipping minified Playwright tests."
          fi

      # -------------------------------------------------------------
      # STEP E: DEPLOY TO MAIN (GITHUB PAGES)
      # -------------------------------------------------------------
      - name: Deploy Minified Build to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: main
          force_orphan: true
